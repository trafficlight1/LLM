<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdnjs.cloudflare.com https://www.gstatic.com https://www.google.com;
    style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    connect-src 'self' https://nominatim.openstreetmap.org https://overpass-api.de https://*.firebaseio.com https://*.googleapis.com https://securetoken.googleapis.com https://unpkg.com https://www.gstatic.com;
    img-src 'self' data: blob: https://*.openstreetmap.org https://*.tile.openstreetmap.org https://unpkg.com https://*.basemaps.cartocdn.com;
">
    <title>Підсвітити ліхтар AI</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

<canvas id="backgroundCanvas"></canvas>
<div class="frosted-overlay"></div>

<div class="welcome-screen" id="welcomeScreen">
    <div class="welcome-logo">
        <a href="https://pidsvitu.com">
            <img src="logoX.png" alt="Logo">
        </a>
    </div>
    <div class="welcome-title">Підсвітити ліхтар AI</div>

    <div class="chatgpt-input-container">
        
        <div class="input-wrapper">
            <select id="streetPrefix" title="Тип вулиці">
                <option value="Вулиця">Вулиця</option>
                <option value="Проспект">Проспект</option>
                <option value="Площа">Площа</option>
                <option value="Парк">Парк</option>
            </select>
            <div style="position: relative; flex-grow: 1;">
                <input type="text" id="streetNamePart" placeholder="Яку вулицю аналізувати?" autocomplete="on">
                <ul id="suggestionsList" class="suggestions-list"></ul>
            </div>
        </div>

        <div style="display: flex; gap: 8px;">
            <button id="analyzeBtn" class="submit-button" onclick="handleSearchClick()">
                <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
                <span class="button-text">Шукаю</span>
                <span class="button-loader"></span>
                <svg class="checkmark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </button>
        </div>
    </div>
    <div class="quick-actions">
        <button class="glass-chip" onclick="quickSearch('Парк', 'Івана Франка')">
            ✦  Парк Франка
        </button>
        <button class="glass-chip" onclick="quickSearch('Вулиця', 'Лисенка')">
            Вулиця Лисенка
        </button>
    </div>
    <div class="footer-text">Захищено правом власності <br>Дмитро Мойсеєнко ексклюзивно для Підсвітити ліхтар.</div>
</div>

<div class="map-container" id="mapContainer">
    <div class="map-logo">
        <a href="https://pidsvitu.com">
            <img src="Framelogo.png" alt="Logo">
        </a>
    </div>
    <main class="map-wrapper" style="width: 100%; height: 100%;">
        <div id="map"></div>
    </main>
</div>

<div class="bottom-panel" id="bottomPanel">
    <div class="panel-content">
        <div class="panel-section">
            <div class="panel-title">Результати аналізу</div>
            <div id="status">Очікування...</div>
            
            <div id="recommendations">
                <div class="rec-header">
                    <div class="rec-title">Рекомендації</div>
                    <a href="https://gemini.google.com/share/66254caec02b" target="_blank" class="details-btn">Детальніше</a>
                </div>
                <div class="rec-item">
                    <div class="rec-label">Щільність забудови</div>
                    <div class="rec-value" id="rec-density">...</div>
                </div>
                <div class="rec-item">
                    <div class="rec-label">Колірна температура</div>
                    <div class="rec-value" id="rec-temp">...</div>
                </div>
                <div class="rec-item">
                    <div class="rec-label">Тип кріплення</div>
                    <div class="rec-value" id="rec-mount">...</div>
                </div>
            </div>
        </div>

        <div class="panel-section">
            <div class="button-group">
    
                <div id="simGroup" class="sim-wrapper">
                    <button id="lightBtn" onclick="simulateLighting()">
                        Симуляція ✦
                    </button>
                    
                    <button id="harmonizeBtn" onclick="harmonizeLights()">
                        Гармонізація
                    </button>
                </div>
            
                <button id="crossingsBtn" onclick="findCrossings()">
                    Знайти переходи
                </button>
                
                <button id="resetBtn" onclick="resetMap()">
                    Скинути карту
                </button>
            </div>
        </div>
        </div>
    </div>
</div>

<input type="hidden" id="cityInput" value="Lviv">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js"></script>

<script>
    const canvas = document.getElementById('backgroundCanvas');
    const ctx = canvas.getContext('2d');
    
    let animationTime = 0;
    let animationFrame;
    let whiskers = [];
    
    const NUM_WHISKERS = 800;
    const CENTER_MOVEMENT = 0.8;
    
    function resizeCanvas() {
        const vh = window.innerHeight;
        const vw = window.innerWidth;
        canvas.width = vw;
        canvas.height = vh;
        canvas.style.width = vw + 'px';
        canvas.style.height = vh + 'px';
    }
    
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 100));
    
    class Whisker {
        constructor() {
            this.phi = Math.random() * Math.PI;
            this.theta = Math.random() * 2 * Math.PI;
            this.baseLength = 100 + Math.random() * 200;
            this.thickness = 0.4 + Math.random() * 1.2;
            this.opacityOffset = Math.random() * Math.PI * 2;
            this.opacitySpeed = 0.6 + Math.random() * 1.0;
            this.dotSize = 1 + Math.random() * 2.5;
            this.chaosAmplitudeAngle = 0.01 + Math.random() * 0.015;
            this.chaosAmplitudeLength = 8 + Math.random() * 15;
            this.chaosSpeed = 0.5 + Math.random() * 0.8;
            this.chaosPhase = Math.random() * Math.PI * 2;
            this.depthPhase = Math.random() * Math.PI * 2;
            this.currentZ = 0;
        }
        
        getPosition(time, centerX, centerY, canvasWidth, canvasHeight) {
            const angleOffsetPhi = Math.cos(time * this.chaosSpeed + this.chaosPhase) * this.chaosAmplitudeAngle;
            const angleOffsetTheta = Math.sin(time * this.chaosSpeed * 1.3 + this.chaosPhase + 1.5) * this.chaosAmplitudeAngle * 0.6;
            const currentPhi = this.phi + angleOffsetPhi;
            const currentTheta = this.theta + angleOffsetTheta;
            const lengthOffset = Math.sin(time * this.chaosSpeed * 0.5 + this.chaosPhase * 0.8) * this.chaosAmplitudeLength;
            const currentLength = this.baseLength + lengthOffset;
            const z = Math.cos(currentPhi);
            const rSinPhi = Math.sin(currentPhi);
            const x = rSinPhi * Math.cos(currentTheta);
            const y = rSinPhi * Math.sin(currentTheta);
            const isMobile = canvasWidth < 768;
            let scale = isMobile ? (canvasHeight / 400) * 1.2 : Math.min(canvasWidth, canvasHeight) / 500;
            const endX = centerX + x * currentLength * scale;
            const endY = centerY + y * currentLength * scale;
            this.currentZ = z;
            return { start: { x: centerX, y: centerY }, end: { x: endX, y: endY } };
        }
        
        getOpacity(time) {
            const opacityWave = Math.sin(time * this.opacitySpeed + this.opacityOffset) * 0.5 + 0.5;
            const depthFactor = (this.currentZ + 1) / 2;
            return (0.15 + 0.7 * opacityWave) * (0.3 + 0.7 * depthFactor);
        }
    }
    
    whiskers = Array.from({ length: NUM_WHISKERS }, () => new Whisker());
    
    function getCenterPosition(time, canvasWidth, canvasHeight) {
        const centerX = canvasWidth / 2 + Math.cos(time) * CENTER_MOVEMENT;
        const centerY = canvasHeight / 2 + Math.sin(time) * CENTER_MOVEMENT;
        return { x: centerX, y: centerY };
    }
    
    function sortWhiskersByDepth() {
        whiskers.sort((a, b) => (a.currentZ || 0) - (b.currentZ || 0));
    }
    
    function drawFrame() {
        const time = animationTime;
        const width = canvas.width;
        const height = canvas.height;
        const center = getCenterPosition(time, width, height);
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, width, height);
        whiskers.forEach(whisker => whisker.getPosition(time, center.x, center.y, width, height));
        sortWhiskersByDepth();
        whiskers.forEach((whisker, index) => {
            const pos = whisker.getPosition(time, center.x, center.y, width, height);
            const opacity = whisker.getOpacity(time);
            const colorShift = (index / NUM_WHISKERS + time * 0.05) % 1;
            let hue;
            if (colorShift < 0.25) hue = 270 + (colorShift * 4) * 20;
            else if (colorShift < 0.5) hue = 200 + ((colorShift - 0.25) * 4) * 40;
            else if (colorShift < 0.75) hue = 300 + ((colorShift - 0.5) * 4) * 30;
            else hue = 160 + ((colorShift - 0.75) * 4) * 40;
            const lineGradient = ctx.createLinearGradient(pos.start.x, pos.start.y, pos.end.x, pos.end.y);
            lineGradient.addColorStop(0, `hsla(${hue}, 70%, 50%, ${opacity * 0.3})`);
            lineGradient.addColorStop(0.5, `hsla(${(hue + 20) % 360}, 85%, 65%, ${opacity * 0.7})`);
            lineGradient.addColorStop(1, `hsla(${(hue + 40) % 360}, 95%, 75%, ${opacity})`);
            ctx.strokeStyle = lineGradient;
            ctx.lineWidth = whisker.thickness;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(pos.start.x, pos.start.y);
            ctx.lineTo(pos.end.x, pos.end.y);
            ctx.stroke();
            ctx.fillStyle = `hsla(${(hue + 40) % 360}, 100%, 80%, ${opacity * 0.95})`;
            ctx.beginPath();
            ctx.arc(pos.end.x, pos.end.y, whisker.dotSize, 0, Math.PI * 2);
            ctx.fill();
        });
    }
    
    function animate() {
        animationTime += 0.02;
        drawFrame();
        animationFrame = requestAnimationFrame(animate);
    }
    
    function stopAnimation() {
        if (animationFrame) {
            cancelAnimationFrame(animationFrame);
            animationFrame = null;
        }
        document.body.classList.add('map-active');
    }
    
    function startAnimation() {
        document.body.classList.remove('map-active');
        if (!animationFrame) animate();
    }
    
    window.stopBackgroundAnimation = stopAnimation;
    window.startBackgroundAnimation = startAnimation;
    animate();
</script>

<script src="script.js"></script>

</body>
</html>
