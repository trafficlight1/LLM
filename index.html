<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdnjs.cloudflare.com https://www.gstatic.com https://www.google.com;
    style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    connect-src 'self' https://nominatim.openstreetmap.org https://overpass-api.de https://*.firebaseio.com https://*.googleapis.com https://securetoken.googleapis.com https://unpkg.com https://www.gstatic.com;
    img-src 'self' data: blob: https://*.openstreetmap.org https://*.tile.openstreetmap.org https://unpkg.com https://*.basemaps.cartocdn.com;
">
    <title>Підсвітити ліхтар AI</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="welcome-screen" id="welcomeScreen">
    <div class="welcome-logo">
        <a href="https://pidsvitu.com">
            <img src="logoX.png" alt="Logo">
        </a>
    </div>
    <div class="welcome-title">Підсвітити ліхтар AI</div>

    <div class="chatgpt-input-container">
        
        <div class="input-wrapper">
            <select id="streetPrefix" title="Тип вулиці">
                <option value="Вулиця">Вулиця</option>
                <option value="Проспект">Проспект</option>
                <option value="Площа">Площа</option>
                <option value="Парк">Парк</option>
            </select>
            <div style="position: relative; flex-grow: 1;">
                <input type="text" id="streetNamePart" placeholder="Яку вулицю аналізувати?" autocomplete="on">
                <ul id="suggestionsList" class="suggestions-list"></ul>
            </div>
        </div>

        <div style="display: flex; gap: 8px;">
            <button id="analyzeBtn" class="submit-button" onclick="handleSearchClick()">
                <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
                <span class="button-text">Шукаю</span>
                <span class="button-loader"></span>
                <svg class="checkmark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </button>
        </div>
    </div>
    <div class="quick-actions">
        <button class="glass-chip" onclick="quickSearch('Парк', 'Івана Франка')">
            ✦  Парк Франка
        </button>
        <button class="glass-chip" onclick="quickSearch('Вулиця', 'Лисенка')">
            Вулиця Лисенка
        </button>
    </div>
    <div class="footer-text">Захищено правом власності <br>Дмитро Мойсеєнко ексклюзивно для Підсвітити ліхтар.</div>
</div>

<div class="map-container" id="mapContainer">
    <div class="map-logo">
        <a href="https://pidsvitu.com">
            <img src="Framelogo.png" alt="Logo">
        </a>
    </div>
    <main class="map-wrapper" style="width: 100%; height: 100%;">
        <div id="map"></div>
    </main>
</div>

<div class="bottom-panel" id="bottomPanel">
    <div class="panel-content">
        <div class="panel-section">
            <div class="panel-title">Результати аналізу</div>
            <div id="status">Очікування...</div>
            
            <div id="recommendations">
                <div class="rec-header">
                    <div class="rec-title">Рекомендації</div>
                    <a href="https://gemini.google.com/share/66254caec02b" target="_blank" class="details-btn">Детальніше</a>
                </div>
                <div class="rec-item">
                    <div class="rec-label">Щільність забудови</div>
                    <div class="rec-value" id="rec-density">...</div>
                </div>
                <div class="rec-item">
                    <div class="rec-label">Колірна температура</div>
                    <div class="rec-value" id="rec-temp">...</div>
                </div>
                <div class="rec-item">
                    <div class="rec-label">Тип кріплення</div>
                    <div class="rec-value" id="rec-mount">...</div>
                </div>
            </div>
        </div>

        <div class="panel-section">
            <div class="button-group">
    
                <div id="simGroup" class="sim-wrapper">
                    <button id="lightBtn" onclick="simulateLighting()">
                        Симуляція ✦
                    </button>
                    
                    <button id="harmonizeBtn" onclick="harmonizeLights()">
                        Гармонізація
                    </button>
                </div>
            
                <button id="crossingsBtn" onclick="findCrossings()">
                    Знайти переходи
                </button>
                
                <button id="resetBtn" onclick="resetMap()">
                    Скинути карту
                </button>
            </div>
        </div>
        </div>
    </div>
</div>

<input type="hidden" id="cityInput" value="Lviv">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js"></script>

<script src="script.js"></script>

</body>
</html>
